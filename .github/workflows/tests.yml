name: Run tests

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    name: tests (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu requirements
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # zlib for -lz (offzip/packzip); gcc and make are preinstalled.
          sudo apt-get -y install zlib1g-dev

      - name: Install mbedTLS
        run: |
          curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xz -C ./
          cd mbedtls-2.16.12
          mkdir build && cd build
          cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make mbedcrypto

      - name: Run test suite
        run: |
          cd tests
          make ci

  # Known-answer vectors against real game saves. Neither the saves nor the
  # patches are vendored, so this job checks out both repos and runs every
  # vector in test_samples.c: the save-decrypters samples, plus the Python
  # helper modules in apollo-patches.
  #
  # `make check-full` is strict: a vector that skips fails the job, because
  # here a skip means a sample was renamed or removed upstream.
  #
  # Both repos are taken at their default branch, so a change there can turn
  # this job red without a commit here. That is the point -- it is the only
  # place the two are tested together -- but check the log before blaming
  # libapollo.
  samples:
    runs-on: ubuntu-latest
    name: samples (save-decrypters)

    steps:
      - uses: actions/checkout@v4

      - name: Checkout save-decrypters
        uses: actions/checkout@v4
        with:
          repository: bucanero/save-decrypters
          path: save-decrypters

      - name: Checkout apollo-patches
        uses: actions/checkout@v4
        with:
          repository: bucanero/apollo-patches
          path: apollo-patches

      - name: Install Ubuntu requirements
        run: |
          sudo apt-get update
          sudo apt-get -y install zlib1g-dev

      - name: Install mbedTLS
        run: |
          curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xz -C ./
          cd mbedtls-2.16.12
          mkdir build && cd build
          cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make mbedcrypto

      - name: Run sample vectors
        run: |
          cd tests
          make check-full SAMPLES=$GITHUB_WORKSPACE/save-decrypters PATCHES=$GITHUB_WORKSPACE/apollo-patches

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-full-log
          path: tests/build/check-full.log

  # The suite on a real big-endian host: cross-built for 64-bit PowerPC (the
  # PS3's CPU family) and run under qemu-user. The "BE pass" of the other jobs
  # only flags the codes big-endian; the host is still little-endian there, so
  # every host-order path (BE16/32/64, _swap_var_endianness(), the variable
  # store) is a no-op and never really runs. Here it does.
  #
  # check-corpus as well as ci: the goldens were produced on a little-endian
  # machine, so reproducing them byte for byte here is the direct proof that
  # the engine's output does not depend on the host.
  big-endian:
    runs-on: ubuntu-latest
    name: tests (ppc64 big-endian, qemu)

    env:
      CC: powerpc64-linux-gnu-gcc
      ZLIB: ${{ github.workspace }}/zlib-ppc64

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross qemu-user

      # Ubuntu has no ppc64 big-endian packages, so zlib is cross-built.
      - name: Build zlib (ppc64)
        run: |
          curl -sL -o zlib.tar.gz https://zlib.net/fossils/zlib-1.3.1.tar.gz
          echo "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  zlib.tar.gz" | sha256sum -c -
          tar xzf zlib.tar.gz
          cd zlib-1.3.1
          CHOST=powerpc64-linux-gnu ./configure --static --prefix=$ZLIB
          make -j4 install

      - name: Build mbedTLS (ppc64)
        run: |
          curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xz -C ./
          cd mbedtls-2.16.12
          mkdir build && cd build
          cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER=$CC \
                   -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=ppc64 \
                   -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF
          make mbedcrypto

      # Static, so qemu-ppc64 needs no target sysroot to run it.
      - name: Run test suite
        run: |
          cd tests
          make ci check-corpus CC=$CC RUN=qemu-ppc64 \
               EXTRA_CFLAGS=-I$ZLIB/include LIBZ="-L$ZLIB/lib -lz" EXTRA_LDFLAGS=-static
