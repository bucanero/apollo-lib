name: Build Windows binaries

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  # x64 Windows build via MSYS2. (32-bit is handled by the win32-cross job below,
  # because MSYS2 no longer ships a working 32-bit toolchain — its MINGW32 target
  # silently produced x86-64 binaries.)
  msys:
    runs-on: windows-2022
    strategy:
      matrix:
        mingw: ["MINGW64"]
        include:
          - mingw: "MINGW64"
            package: "mingw-w64-x86_64"
    defaults:
      run:
        shell: bash.exe --login -eo pipefail "{0}"
    env:
      MSYSTEM: ${{ matrix.mingw }}
      CHERE_INVOKING: 1
    name: MSYS2 ${{ matrix.mingw }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up shell
        run: echo "C:\msys64\usr\bin\" >> $GITHUB_PATH
        shell: pwsh

      - name: Install MinGW requirements
        run: |
          uname
          echo "$GITHUB_WORKSPACE"
          # GUI build toolchain: CMake + Ninja (mingw) and git for FetchContent.

      - name: Install mbedTLS
        run: |
          curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xvz -C ./
          cd mbedtls-2.16.12/library
          mkdir -p ../build/library
          CC=gcc make static
          cp libmbedcrypto.a ../build/library

      - name: Build binaries
        run: |
          cd tools
          make BIGENDIAN=1
          mv patcher.exe patcher-bigendian.exe
          make clean && make

      - name: Build Apollo Patcher GUI
        run: |
          cd gui
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          mkdir -p dist
          cp build/apollo_patcher_gui.exe dist/

      # Software OpenGL is NOT bundled with the GUI — it ships as a SEPARATE,
      # opt-in artifact. Users who get an OpenGL error (RDP / GPU-less hosts) drop
      # these 3 DLLs next to apollo_patcher_gui.exe. x64 uses Mesa's mingw build.
      - name: Package software OpenGL (Mesa llvmpipe, x64)
        run: |
          MESA_VER=23.0.3
          curl -sL -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VER}/mesa3d-${MESA_VER}-release-mingw.7z"
          7z x -y -omesa mesa.7z
          mkdir -p softgl
          for dll in opengl32.dll libgallium_wgl.dll libglapi.dll; do
            cp "mesa/x64/${dll}" softgl/
          done
          ls -l softgl/

      - name: Get short SHA
        run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-cli-${{ env.sha_name }}-${{matrix.mingw}}
          path: |
            tools/patcher.exe
            tools/dumper.exe
            tools/patcher-bigendian.exe

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-gui-${{ env.sha_name }}-${{matrix.mingw}}
          path: gui/dist

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-softgl-${{ env.sha_name }}-${{matrix.mingw}}
          path: softgl

  # Genuine 32-bit (x86) Windows build, cross-compiled on Linux with mingw-w64
  # (MSYS2 no longer provides a working 32-bit toolchain). Produces both the CLI
  # tools and the GUI as real x86 PE binaries.
  win32-cross:
    runs-on: ubuntu-latest
    name: Windows x86 (Linux cross)
    env:
      TC: i686-w64-mingw32
    steps:
      - uses: actions/checkout@v4

      - name: Install i686 mingw cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            libz-mingw-w64-dev cmake ninja-build p7zip-full

      - name: Fetch mbedTLS
        run: |
          curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xz -C ./

      - name: Cross-build mbedcrypto (i686)
        run: |
          cmake -S mbedtls-2.16.12 -B mbedtls-2.16.12/build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/gui/cmake/mingw-i686.cmake" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF
          cmake --build mbedtls-2.16.12/build --target mbedcrypto -j
          ls -l mbedtls-2.16.12/build/library/libmbedcrypto.a

      - name: Cross-build CLI tools (i686)
        run: |
          cd tools
          make CC=${TC}-gcc BIGENDIAN=1
          mv patcher.exe patcher-bigendian.exe
          make CC=${TC}-gcc clean && make CC=${TC}-gcc
          file patcher.exe dumper.exe patcher-bigendian.exe

      - name: Cross-build Apollo Patcher GUI (i686)
        run: |
          cd gui
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/gui/cmake/mingw-i686.cmake"
          cmake --build build
          mkdir -p dist
          cp build/apollo_patcher_gui.exe dist/
          file dist/apollo_patcher_gui.exe

      # Software OpenGL as a SEPARATE, opt-in artifact (not bundled with the GUI).
      # For x86 we use Mesa's MSVC build: the mingw x86 llvmpipe crashes in
      # libgallium_wgl.dll on 32-bit Win7, so this is the alternative to compare.
      # NOTE: the MSVC DLLs may need the VC++ 2015–2022 x86 runtime on the target.
      - name: Package software OpenGL (Mesa llvmpipe, x86 MSVC)
        run: |
          MESA_VER=23.0.3
          curl -sL -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VER}/mesa3d-${MESA_VER}-release-msvc.7z"
          7z x -y -omesa mesa.7z
          mkdir -p softgl
          for dll in opengl32.dll libgallium_wgl.dll libglapi.dll; do
            cp "mesa/x86/${dll}" softgl/
          done
          ls -l softgl/

      - name: Get short SHA
        run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-cli-${{ env.sha_name }}-win32
          path: |
            tools/patcher.exe
            tools/dumper.exe
            tools/patcher-bigendian.exe

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-gui-${{ env.sha_name }}-win32
          path: gui/dist

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-softgl-${{ env.sha_name }}-win32
          path: softgl
