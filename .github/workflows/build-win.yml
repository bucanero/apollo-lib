name: Build Windows binaries

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  msys:
    runs-on: windows-2022
    strategy:
      matrix:
        mingw: ["MINGW32", "MINGW64"]
        include:
          - mingw: "MINGW32"
            package: "mingw-w64-i686"
          - mingw: "MINGW64"
            package: "mingw-w64-x86_64"
    defaults:
      run:
        shell: bash.exe --login -eo pipefail "{0}"
    env:
      MSYSTEM: ${{ matrix.mingw }}
      CHERE_INVOKING: 1
    name: MSYS2 ${{ matrix.mingw }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up shell
        run: echo "C:\msys64\usr\bin\" >> $GITHUB_PATH
        shell: pwsh

      - name: Install MinGW requirements
        run: |
          uname
          echo "$GITHUB_WORKSPACE"
          # GUI build toolchain: CMake + Ninja (mingw) and git for FetchContent.

      - name: Install mbedTLS
        run: |
          curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xvz -C ./
          cd mbedtls-2.16.12/library
          mkdir -p ../build/library
          CC=gcc make static
          cp libmbedcrypto.a ../build/library

      - name: Build binaries
        run: |
          cd tools
          make BIGENDIAN=1
          mv patcher.exe patcher-bigendian.exe
          make clean && make

      - name: Build Apollo Patcher GUI
        run: |
          cd gui
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          mkdir -p dist
          cp build/apollo_patcher_gui.exe dist/

      - name: Bundle software OpenGL (Mesa llvmpipe) for RDP / GPU-less hosts
        run: |
          # RDP sessions expose no WGL OpenGL at all, so a self-contained
          # software GL is required. Mesa 23.0.3 is the last series that still
          # runs on Windows 7 (Mesa ~24 dropped it). Re-verify on Win7 if bumped.
          MESA_VER=23.0.3
          case "${{ matrix.mingw }}" in
            MINGW64) ARCH=x64 ;;
            MINGW32) ARCH=x86 ;;
          esac
          curl -sL -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VER}/mesa3d-${MESA_VER}-release-mingw.7z"
          # Mesa's opengl32.dll is a thin loader that needs libgallium_wgl.dll
          # (the llvmpipe/LLVM driver) plus its sibling runtime DLLs — bundle the
          # whole arch folder so every dependency is next to the .exe.
          7z x -y -omesa mesa.7z
          cp mesa/${ARCH}/*.dll gui/dist/
          ls -l gui/dist/

      - name: Get short SHA
        run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-cli-${{ env.sha_name }}-${{matrix.mingw}}
          path: |
            tools/patcher.exe
            tools/dumper.exe
            tools/patcher-bigendian.exe

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-gui-${{ env.sha_name }}-${{matrix.mingw}}
          path: gui/dist
