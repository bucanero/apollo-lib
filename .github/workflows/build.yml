name: Build binaries

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Ubuntu requirements
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Linux requirements"
        sudo apt-get update
        # zlib + GUI build deps: GLFW needs X11/GL headers. File dialogs use
        # portable-file-dialogs (zenity at runtime — not a build dependency).
        sudo apt-get -y install zlib1g-dev libgl1-mesa-dev xorg-dev

    - name: Install macOS requirements
      if: matrix.os == 'macos-latest'
      run: |
        echo "macOS requirements"
        # GLFW uses Cocoa; file dialogs use osascript. Both ship with the OS. Nothing to install.

    - name: Install mbedTLS
      run: |
        curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xvz -C ./
        cd mbedtls-2.16.12
        mkdir build && cd build
        cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        make mbedcrypto

    - name: Build Apollo CLI tools
      run: |
        cd tools
        make BIGENDIAN=1
        mv patcher patcher-bigendian
        make clean && make

    - name: Build Apollo Patcher GUI
      run: |
        cd gui
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j
        # Normalise the output path across OSes for the upload step.
        mkdir -p dist
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          cp -R build/apollo_patcher_gui.app dist/
        else
          cp build/apollo_patcher_gui dist/
        fi

    - name: Get short SHA
      run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - uses: actions/upload-artifact@v4
      with:
        name: apollo-cli-${{ env.sha_name }}-${{matrix.os}}
        path: |
          tools/patcher
          tools/dumper
          tools/patcher-bigendian

    - uses: actions/upload-artifact@v4
      with:
        name: apollo-gui-${{ env.sha_name }}-${{matrix.os}}
        path: gui/dist
